{% extends "base.html" %}

{% block title %}Add New Part - CMMS{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add New Part</h2>
</div>

<div class="form-container">
    <form method="POST" class="form">
        <div class="form-group">
            <label for="name">Part Name *</label>
            <input type="text" id="name" name="name" required class="form-input"
                   placeholder="e.g., Injection Pump">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" class="form-input"
                      placeholder="Detailed description of the part"></textarea>
        </div>

        <div class="form-group">
            <label for="location">Location *</label>
            <input type="text" id="location" name="location" required class="form-input"
                   placeholder="e.g., Ink Injection System - Unit A">
        </div>

        <div class="form-group">
            <label for="part_number">Part Number *</label>
            <input type="text" id="part_number" name="part_number" required class="form-input"
                   placeholder="e.g., INK-PUMP-001">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Part</button>
            <a href="{{ url_for('parts') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
