{% extends "base.html" %}

{% block title %}Add Instruction - CMMS{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Add Maintenance Instruction</h2>
    <p class="subtitle">{{ part.name }}</p>
</div>

<div class="form-container">
    <form method="POST" class="form">
        <div class="info-box">
            <p><strong>Part:</strong> {{ part.name }}</p>
            <p><strong>Part Number:</strong> {{ part.part_number }}</p>
        </div>

        <div class="form-group">
            <label for="step_number">Step Number *</label>
            <input type="number" id="step_number" name="step_number" required
                   class="form-input" value="{{ next_step }}" min="1">
        </div>

        <div class="form-group">
            <label for="instruction_text">Instruction Text *</label>
            <textarea id="instruction_text" name="instruction_text" required
                      rows="6" class="form-input"
                      placeholder="Enter detailed instruction for this step..."></textarea>
            <small>Be clear and concise. Include important safety warnings if applicable.</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Instruction</button>
            <a href="{{ url_for('view_instructions', part_id=part.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
